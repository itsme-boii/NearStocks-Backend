# Non-secret env vars for the api-server Cloud Run service. Values from near-mainnet.env.example
# (repo root) — copy this pattern for the other 8 services, filling in each one's real needs.
# Passed to `gcloud run deploy` via --env-vars-file (see cloudbuild.yaml's _ENV_VARS_FILE).
#
# Anything containing a password/key does NOT belong here — see deploy/gcp/README.md for those
# (DSN, NEAR_SEQUENCER_PRIVATE_KEY / NEAR_SEQUENCER_KMS_KEY_ID, NEAR_TREASURY_PRIVATE_KEY, etc.
# all go through Secret Manager + cloudbuild.yaml's _SECRETS, never in a file like this one).

IS_DEV: "0"
NEAR_NETWORK: mainnet
NEAR_RPC_URL: https://rpc.mainnet.fastnear.com
NEAR_STOCKS_ACCOUNT: near-stocks.near
NEAR_USDC_CONTRACT: "17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1"
NEAR_BROKER_ID: "2"
NEAR_TREASURY_ACCOUNT: "8f4015265b9b67afca2ebbfd81c82e10b2a75e68c28916943f724b2068e30d15"
NEAR_SEQUENCER_ACCOUNT: "9bce340bdc623a5fca6d12ca6ab3f49a42e2a1eac97d648339dd0209bff26946"
NEAR_WITHDRAW_MAX_USDC: "1000"
# Fill in once the other services' Cloud Run URLs are known (first deploy is chicken-and-egg —
# deploy once, read back the assigned URLs, redeploy this file with them set):
ENGINE_URL: ""
BALANCE_SERVER_URL: ""
LIQUIDATION_URL: ""
ORACLE_SERVER_URL: ""
CORS_ALLOWED_ORIGINS: "https://your-production-frontend-domain"
