[workspace]
resolver = "2"
members = ["core", "mock-ft", "logx-token"]

[workspace.dependencies]
# Pinned exactly (Development.md §5.5): `unstable` is required for env::ecrecover.
near-sdk = { version = "=5.29.1", features = ["unstable"] }
serde_json = "1"
ethnum = "1.5.3"
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
