version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  amm:
    build:
      context: .
      dockerfile: services/amm/Dockerfile
    environment:
      DSN: "host=postgres user=postgres password=postgres dbname=postgres port=5432 sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  api-server:
    build:
      context: .
      dockerfile: services/api-server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DSN: "host=postgres user=postgres password=postgres dbname=postgres port=5432 sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  balance-server:
    build:
      context: .
      dockerfile: services/balance-server/Dockerfile
    environment:
      DSN: "host=postgres user=postgres password=postgres dbname=postgres port=5432 sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  cron-server:
    build:
      context: .
      dockerfile: services/cron-server/Dockerfile
    environment:
      DSN: "host=postgres user=postgres password=postgres dbname=postgres port=5432 sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  engine:
    build:
      context: .
      dockerfile: services/engine/Dockerfile
    environment:
      DSN: "host=postgres user=postgres password=postgres dbname=postgres port=5432 sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  external-campaigns:
    build:
      context: .
      dockerfile: services/external-campaigns/Dockerfile
    environment:
      DSN: "host=postgres user=postgres password=postgres dbname=postgres port=5432 sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  freya:
    build:
      context: .
      dockerfile: services/freya/Dockerfile
    environment:
      DSN: "host=postgres user=postgres password=postgres dbname=postgres port=5432 sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  indexer-server:
    build:
      context: .
      dockerfile: services/indexer-server/Dockerfile
    environment:
      DSN: "host=postgres user=postgres password=postgres dbname=postgres port=5432 sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  liquidation:
    build:
      context: .
      dockerfile: services/liquidation/Dockerfile
    environment:
      DSN: "host=postgres user=postgres password=postgres dbname=postgres port=5432 sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

volumes:
  postgres_data:
